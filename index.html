<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公文簽呈管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- 頂部導覽列 -->
  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        <span class="text-blue-600">📄</span> 公文簽呈管理系統
      </h1>
      <div class="text-sm text-gray-600">
        目前使用者：<span id="currentUser" class="font-semibold text-gray-800">楊雅淇</span>
      </div>
    </div>
    
    <!-- 功能頁籤 -->
    <div class="max-w-4xl mx-auto px-4 flex gap-6 border-t border-gray-100 text-sm font-medium">
      <button id="tabCreate" onclick="switchTab('create')" class="py-2.5 border-b-2 border-blue-600 text-blue-600 font-bold transition">填寫簽呈單</button>
      <button id="tabList" onclick="switchTab('list')" class="py-2.5 text-gray-500 hover:text-gray-700 transition">我的簽呈單</button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-6">

    <!-- 頁籤一：填寫簽呈單 -->
    <div id="viewCreate">
      <form id="signForm" class="space-y-6">

        <!-- 區塊一：公文基本資料 -->
        <section class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
          <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4 flex items-center gap-2">
            <span class="w-2 h-4 bg-blue-600 rounded-full inline-block"></span> 公文基本資料
          </h2>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 所屬公司名稱 -->
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">所屬公司名稱 <span class="text-red-500">*</span></label>
              <select id="company" required class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="">請選擇所屬公司</option>
                <option value="太綺水電工程有限公司">太綺水電工程有限公司</option>
                <option value="匠人本紀永續控股股份有限公司">匠人本紀永續控股股份有限公司</option>
                <option value="橡欣立工程有限公司">橡欣立工程有限公司</option>
              </select>
            </div>

            <!-- 公文類別 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">公文類別 <span class="text-red-500">*</span></label>
              <select id="docCategory" onchange="toggleTaxSection()" class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="一般公文">1. 一般公文</option>
                <option value="稅務公文">2. 稅務公文</option>
              </select>
            </div>

            <!-- 緊急程度 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">緊急程度 <span class="text-red-500">*</span></label>
              <select id="urgency" class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="普通">普通</option>
                <option value="急件">急件</option>
                <option value="特急件">特急件</option>
              </select>
            </div>

            <!-- 申請人 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">申請人 <span class="text-red-500">*</span></label>
              <input type="text" id="applicant" value="楊雅淇" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- 申請部門 -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">申請部門 <span class="text-red-500">*</span></label>
              <select id="department" class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="行政部">行政部</option>
                <option value="工程部">工程部</option>
                <option value="會計部">會計部</option>
                <option value="管理部">管理部</option>
              </select>
            </div>

            <!-- 申請日期 -->
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700 mb-1">申請日期 <span class="text-red-500">*</span></label>
              <input type="date" id="applyDate" required class="w-full border border-gray-300 rounded-md p-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>
        </section>

        <!-- 區塊二：簽呈內容 -->
        <section class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
          <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4 flex items-center gap-2">
            <span class="w-2 h-4 bg-blue-600 rounded-full inline-block"></span> 簽呈內容
          </h2>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">簽呈主旨 <span class="text-red-500">*</span></label>
              <input type="text" id="subject" placeholder="請輸入本次簽呈主旨..." required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">說明與詳細背景 <span class="text-red-500">*</span></label>
              <textarea id="content" rows="4" placeholder="請詳細說明簽呈背景原因、說明事項或補充資訊..." required class="w-full border border-gray-300 rounded-md p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>
          </div>
        </section>

        <!-- 區塊三：稅務明細（選擇「稅務公文」時動態顯示） -->
        <section id="taxSection" class="hidden bg-purple-50/60 rounded-lg p-6 border border-purple-200 space-y-4">
          <div class="flex justify-between items-center border-b border-purple-200 pb-3">
            <h2 class="text-lg font-bold text-purple-900 flex items-center gap-2">
              <span>💰</span> 稅務金額明細
            </h2>
            <button type="button" onclick="addTaxRow()" class="text-xs bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-1.5 rounded transition flex items-center gap-1 shadow-sm">
              <span>＋ 新增項目</span>
            </button>
          </div>

          <!-- 項目列表容器 -->
          <div id="taxItemsContainer" class="space-y-3"></div>

          <!-- 合計金額 -->
          <div class="flex justify-end items-center gap-3 pt-3 border-t border-purple-200 font-bold text-purple-900">
            <span>合計金額：</span>
            <span class="text-xl font-mono text-purple-700">NT$ <span id="totalAmountText">0</span></span>
          </div>
        </section>

        <!-- 區塊四：會簽設定 -->
        <section class="bg-white rounded-lg shadow-sm p-6 border border-gray-200">
          <h2 class="text-lg font-bold text-gray-800 border-b pb-3 mb-4 flex items-center gap-2">
            <span class="w-2 h-4 bg-blue-600 rounded-full inline-block"></span> 會簽設定
          </h2>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">需會簽部門（可複選）</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-gray-50 p-3 rounded-md border border-gray-200 text-sm">
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="reviewDept" value="財務部" class="rounded text-blue-600"> 財務部</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="reviewDept" value="法務部" class="rounded text-blue-600"> 法務部</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="reviewDept" value="資訊部" class="rounded text-blue-600"> 資訊部</label>
              <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" name="reviewDept" value="總務部" class="rounded text-blue-600"> 總務部</label>
            </div>
          </div>
        </section>

        <!-- 底部按鈕 -->
        <div class="pt-2">
          <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow transition duration-200 flex justify-center items-center gap-2">
            <span>送出公文簽呈</span>
          </button>
        </div>

      </form>
    </div>

    <!-- 頁籤二：我的簽呈單列表 -->
    <div id="viewList" class="hidden space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-gray-800">歷史公文紀錄</h2>
        <button onclick="loadSignList()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1 rounded">重新整理</button>
      </div>

      <div id="listContainer" class="space-y-3">
        <p class="text-gray-500 text-center py-8">載入中...</p>
      </div>
    </div>

  </main>

  <!-- JavaScript 邏輯 -->
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxDuBxh_bV7KoglCV5fDp2hjGqoGfuvfxzYqRcAyP3QsLgE-ozDpDDaQxyJX_1r90zI/exec";

    // 自動預設今天日期
    document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];

    // 切換是否顯示「稅務明細」
    function toggleTaxSection() {
      const category = document.getElementById("docCategory").value;
      const taxSection = document.getElementById("taxSection");
      if (category === "稅務公文") {
        taxSection.classList.remove("hidden");
        if (document.querySelectorAll(".tax-row").length === 0) {
          addTaxRow();
        }
      } else {
        taxSection.classList.add("hidden");
      }
    }

    // 新增一列稅務項目
    function addTaxRow() {
      const container = document.getElementById("taxItemsContainer");
      const rowId = "tax_row_" + Date.now();
      const div = document.createElement("div");
      div.className = "tax-row grid grid-cols-12 gap-2 items-center bg-white p-2.5 rounded border border-purple-200 shadow-sm";
      div.id = rowId;

      div.innerHTML = `
        <div class="col-span-6 sm:col-span-7">
          <input type="text" placeholder="稅務說明項目 (如: 營業稅、所得稅...)" class="tax-desc w-full border border-gray-300 rounded p-1.5 text-sm focus:ring-1 focus:ring-purple-500 focus:outline-none">
        </div>
        <div class="col-span-5 sm:col-span-4">
          <input type="number" placeholder="金額 NT$" oninput="calculateTaxTotal()" class="tax-amount w-full border border-gray-300 rounded p-1.5 text-sm font-mono text-right focus:ring-1 focus:ring-purple-500 focus:outline-none">
        </div>
        <div class="col-span-1 text-center">
          <button type="button" onclick="removeTaxRow('${rowId}')" class="text-red-500 hover:text-red-700 font-bold text-sm p-1">✕</button>
        </div>
      `;

      container.appendChild(div);
    }

    // 刪除一列稅務項目
    function removeTaxRow(rowId) {
      const el = document.getElementById(rowId);
      if (el) {
        el.remove();
        calculateTaxTotal();
      }
    }

    // 計算稅務總金額
    function calculateTaxTotal() {
      let total = 0;
      document.querySelectorAll(".tax-amount").forEach(input => {
        const val = parseFloat(input.value) || 0;
        total += val;
      });
      document.getElementById("totalAmountText").innerText = total.toLocaleString();
    }

    // 切換頁籤
    function switchTab(tab) {
      const tabCreate = document.getElementById("tabCreate");
      const tabList = document.getElementById("tabList");
      const viewCreate = document.getElementById("viewCreate");
      const viewList = document.getElementById("viewList");

      if (tab === 'create') {
        tabCreate.className = "py-2.5 border-b-2 border-blue-600 text-blue-600 font-bold transition";
        tabList.className = "py-2.5 text-gray-500 hover:text-gray-700 transition";
        viewCreate.classList.remove("hidden");
        viewList.classList.add("hidden");
      } else {
        tabList.className = "py-2.5 border-b-2 border-blue-600 text-blue-600 font-bold transition";
        tabCreate.className = "py-2.5 text-gray-500 hover:text-gray-700 transition";
        viewList.classList.remove("hidden");
        viewCreate.classList.add("hidden");
        loadSignList();
      }
    }

    // 載入公文列表
    async function loadSignList() {
      const container = document.getElementById("listContainer");
      container.innerHTML = '<p class="text-gray-500 text-center py-8">資料載入中...</p>';

      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const result = await res.json();

        if (result.status === "success" && result.data.length > 0) {
          container.innerHTML = result.data.map(item => {
            let urgencyColor = "bg-gray-100 text-gray-700";
            if (item.urgency === "急件") urgencyColor = "bg-orange-100 text-orange-800 border border-orange-200";
            if (item.urgency === "特急件") urgencyColor = "bg-red-100 text-red-800 font-bold border border-red-200";

            return `
              <div class="bg-white rounded-lg p-5 border border-gray-200 shadow-sm hover:shadow transition space-y-3">
                <div class="flex justify-between items-start border-b pb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-bold px-2.5 py-1 rounded ${item.docCategory === '稅務公文' ? 'bg-purple-100 text-purple-700 border border-purple-200' : 'bg-blue-100 text-blue-700 border border-blue-200'}">
                      ${item.docCategory}
                    </span>
                    <span class="text-xs px-2 py-0.5 rounded ${urgencyColor}">
                      ${item.urgency}
                    </span>
                    <span class="text-xs text-gray-400 font-mono">${item.docId}</span>
                  </div>
                  <span class="text-xs px-2.5 py-1 rounded-full bg-yellow-100 text-yellow-800 font-medium">${item.status}</span>
                </div>

                <div>
                  <h3 class="font-bold text-gray-800 text-base mb-1">${item.subject}</h3>
                  <p class="text-sm text-gray-600 line-clamp-2">${item.content}</p>
                </div>

                ${item.docCategory === '稅務公文' && item.taxItems ? `
                  <div class="text-xs bg-purple-50 p-2.5 rounded text-purple-900 border border-purple-100 space-y-1">
                    <div class="font-bold">💰 稅務明細：${item.taxItems}</div>
                    <div class="text-right font-bold text-purple-700">合計金額：NT$ ${Number(item.totalAmount || 0).toLocaleString()}</div>
                  </div>
                ` : ''}

                <div class="text-xs text-gray-500 flex flex-wrap justify-between items-center pt-2 border-t border-gray-100">
                  <span>公司：<strong class="text-gray-700">${item.company || '太綺水電工程有限公司'}</strong> | 申請人：${item.applicant} (${item.department})</span>
                  <span>申請日期：${item.applyDate}</span>
                </div>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = '<p class="text-gray-500 text-center py-8">目前尚無任何公文紀錄。</p>';
        }
      } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-center py-8">載入失敗，請確認網路或 API 設定！</p>';
        console.error(err);
      }
    }

    // 表單送出
    document.getElementById("signForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>傳送中...</span>`;

      const selectedDepts = [];
      document.querySelectorAll('input[name="reviewDept"]:checked').forEach(cb => {
        selectedDepts.push(cb.value);
      });

      const taxCategory = document.getElementById("docCategory").value;
      const taxList = [];
      let totalAmount = 0;

      if (taxCategory === "稅務公文") {
        document.querySelectorAll(".tax-row").forEach(row => {
          const desc = row.querySelector(".tax-desc").value.trim();
          const amt = parseFloat(row.querySelector(".tax-amount").value) || 0;
          if (desc || amt) {
            taxList.push(`${desc}: NT$${amt.toLocaleString()}`);
            totalAmount += amt;
          }
        });
      }

      const payload = {
        company: document.getElementById("company").value,
        docCategory: taxCategory,
        urgency: document.getElementById("urgency").value,
        applicant: document.getElementById("applicant").value,
        department: document.getElementById("department").value,
        applyDate: document.getElementById("applyDate").value,
        subject: document.getElementById("subject").value,
        content: document.getElementById("content").value,
        taxItems: taxList.join("；"),
        totalAmount: totalAmount,
        reviewDepts: selectedDepts.join("、")
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        
        const result = await response.json();

        if (result.status === "success") {
          alert(`🎉 公文送出成功！\n公文單號：${result.docId}`);
          document.getElementById("signForm").reset();
          document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];
          toggleTaxSection();
          switchTab('list');
        } else {
          alert("❌ 送出失敗：" + result.message);
        }
      } catch (err) {
        alert("⚠️ 連線失敗，請檢查 API 網址設定！");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>送出公文簽呈</span>`;
      }
    });
  </script>
</body>
</html>
