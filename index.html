<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>工程請款／付款管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- 左側導覽列 -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4">
        <div>
            <h1 class="text-white text-lg font-bold mb-6">帳務後台管理</h1>
            <nav class="space-y-2">
                <a href="#" onclick="switchTab('main')" id="navMain" class="block py-2 px-3 rounded bg-slate-800 text-white font-medium">單據總覽</a>
                <a href="#" onclick="switchTab('exception')" id="navException" class="block py-2 px-3 rounded hover:bg-slate-800">人工確認專區 <span class="bg-red-500 text-xs px-2 py-0.5 rounded-full text-white float-right" id="exceptionCount">0</span></a>
                <a href="#" class="block py-2 px-3 rounded hover:bg-slate-800">未付清單</a>
                <a href="#" class="block py-2 px-3 rounded hover:bg-slate-800">未收清單</a>
            </nav>
        </div>
        <div class="text-xs text-slate-500">Render x Apps Script 運作中</div>
    </aside>

    <!-- 右側主要內容區 -->
    <main class="flex-1 flex flex-col overflow-y-auto p-6">
        <header class="flex justify-between items-center mb-6">
            <h2 id="pageTitle" class="text-2xl font-bold text-slate-800">單據即時清單</h2>
            <div class="space-x-2">
                <button onclick="loadDataFromGAS()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 text-sm">重新同步資料</button>
            </div>
        </header>

        <!-- 資料表格區 -->
        <section class="bg-white rounded-lg shadow flex-1 overflow-hidden flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <span id="tableInfo" class="text-sm text-slate-600">載入中...</span>
            </div>
            <div class="flex-1 overflow-y-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 sticky top-0 text-xs text-slate-500 uppercase">
                        <tr>
                            <th class="p-3 border-b">傳票號碼</th>
                            <th class="p-3 border-b">科目名稱</th>
                            <th class="p-3 border-b">原始摘要</th>
                            <th class="p-3 border-b">對應案場</th>
                            <th class="p-3 border-b">借方金額</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody" class="text-sm divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-6 text-center text-slate-400">請點擊「重新同步資料」載入 Google 試算表內容</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        // 請確保這裡填入你最新的 Apps Script 網頁應用程式部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxphubu0NNSWKzIfAprb-ykOjxNwXqNkFBHzyA-BT31N9u-ctsDgkMGp7RB8Cr8f9az/exec";
        
        let allRecords = [];

        async function loadDataFromGAS() {
            const btn = document.querySelector('button[onclick="loadDataFromGAS()"]');
            if (btn) btn.textContent = "同步中...";
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                allRecords = data.records || [];
                renderTable();
                alert("資料同步成功！");
            } catch (error) {
                console.error(error);
                alert("同步失敗，請檢查主控台錯誤訊息。");
            } finally {
                if (btn) btn.textContent = "重新同步資料";
            }
        }

        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = "";
            
            if (allRecords.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">目前無資料</td></tr>`;
                return;
            }

            let count = 0;
            allRecords.forEach(row => {
                count++;
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3 font-mono text-xs">${row.傳票號碼 || '—'}</td>
                    <td class="p-3">${row.科目名稱 || '—'}</td>
                    <td class="p-3">${row.原始摘要 || '—'}</td>
                    <td class="p-3 text-blue-600 font-medium">${row.對應案場 || '未對應案場'}</td>
                    <td class="p-3 font-mono">${row.借方金額 || '0'}</td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('tableInfo').textContent = `共載入 ${count} 筆應付帳款記錄`;
        }
