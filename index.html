<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>工程請款／付款管理系統（智慧解析與人工確認版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <!-- 左側導覽列 -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between p-4">
        <div>
            <h1 class="text-white text-lg font-bold mb-6">帳務後台管理</h1>
            <nav class="space-y-2">
                <a href="#" onclick="switchTab('main')" id="navMain" class="block py-2 px-3 rounded bg-slate-800 text-white font-medium">單據總覽</a>
                <a href="#" onclick="switchTab('exception')" id="navException" class="block py-2 px-3 rounded hover:bg-slate-800">
                    人工確認專區 <span class="bg-red-500 text-xs px-2 py-0.5 rounded-full text-white float-right" id="exceptionCount">0</span>
                </a>
                <a href="#" class="block py-2 px-3 rounded hover:bg-slate-800">未付清單</a>
                <a href="#" class="block py-2 px-3 rounded hover:bg-slate-800">未收清單</a>
            </nav>
        </div>
        <div class="text-xs text-slate-500">Render x Apps Script 運作中</div>
    </aside>

    <!-- 右側主要內容區 -->
    <main class="flex-1 flex flex-col overflow-y-auto p-6">
        <header class="flex justify-between items-center mb-6">
            <h2 id="pageTitle" class="text-2xl font-bold text-slate-800">單據即時清單與智慧解析</h2>
            <div class="space-x-2">
                <button onclick="loadDataFromGAS()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 text-sm">重新同步資料</button>
            </div>
        </header>

        <!-- 摘要智慧輸入與測試區 -->
        <section class="bg-white p-4 rounded-lg shadow mb-6">
            <h3 class="font-bold text-gray-700 mb-2 text-sm">📥 快速登錄與摘要自動解析（支援 B/E 欄案場比對）</h3>
            <div class="flex gap-2">
                <input type="text" id="rawSummaryInput" placeholder="請輸入摘要，例如：12/20-FU47391807-福星段-川瀚興業" class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="parseAndTestSummary()" class="bg-emerald-600 text-white px-4 py-2 rounded text-sm hover:bg-emerald-700">解析並檢查</button>
            </div>
            <div id="parseResult" class="mt-3 text-sm text-gray-600 bg-gray-50 p-3 rounded hidden"></div>
        </section>

        <!-- 主資料表格容器 -->
        <section id="mainTableSection" class="bg-white rounded-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b text-xs text-gray-500 uppercase text-gray-500">
                    <tr>
                        <th class="p-3">單號</th>
                        <th class="p-3">類別</th>
                        <th class="p-3">狀態</th>
                        <th class="p-3">摘要</th>
                        <th class="p-3">系統對應案場</th>
                        <th class="p-3">金額</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="6" class="p-4 text-center text-gray-400">正在從 Google 試算表載入資料...</td></tr>
                </tbody>
            </table>
        </section>

        <!-- 有疑慮人工確認專區容器 -->
        <section id="exceptionTableSection" class="bg-white rounded-lg shadow overflow-hidden hidden">
            <div class="p-4 bg-amber-50 border-b border-amber-200 text-amber-800 text-sm">
                ⚠️ 以下單據因發票格式缺漏或案場無法對應，已被系統自動隔離，請會計人工確認後下拉修正：
            </div>
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b text-xs text-gray-500 uppercase text-gray-500">
                    <tr>
                        <th class="p-3">單號</th>
                        <th class="p-3">原始摘要</th>
                        <th class="p-3">異常原因</th>
                        <th class="p-3">手動修正案場（下拉選單）</th>
                        <th class="p-3">操作</th>
                    </tr>
                </thead>
                <tbody id="exceptionTableBody" class="divide-y divide-gray-200 text-sm">
                    <tr><td colspan="5" class="p-4 text-center text-gray-400">目前沒有需要人工確認的單據</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwwwYielxueSxDu0Icj6CTJdg30RU2Q9jx-VlZpAzZoP-X77udxUeHS85cUxQ_zqd-H/exec";
        let projectList = [];
        let allRecords = [];
        let exceptionRecords = [];

        async function loadDataFromGAS() {
            try {
                let res = await fetch(GAS_URL);
                let data = await res.json();
                projectList = data.projects; 
                allRecords = data.records;
                
                processAndRenderRecords(allRecords);
            } catch (err) {
                console.error("載入失敗", err);
                alert("無法順利從 Google 試算表取得資料，請檢查網路或 GAS 部署狀態。");
            }
        }

        function processAndRenderRecords(records) {
            let tbody = document.getElementById("dataTableBody");
            let exBody = document.getElementById("exceptionTableBody");
            tbody.innerHTML = "";
            exBody.innerHTML = "";
            exceptionRecords = [];

            for (let i = 1; i < records.length; i++) {
                let row = records[i];
                if (!row[0]) continue;

                let summary = row[5] || "";
                let invMatch = summary.match(/[A-Z]{2}\d{8}/i);
                
                let matchedProject = null;
                for (let p of projectList) {
                    if (summary.includes(p.shortName) || summary.includes(p.fullName)) {
                        matchedProject = p.fullName;
                        break;
                    }
                }

                let isException = (!invMatch && !summary.includes("收據") && !summary.includes("附件")) || (!matchedProject && summary !== "");

                if (isException) {
                    exceptionRecords.push({ index: i, row: row });
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="p-3 font-medium">${row[0]}</td>
                        <td class="p-3 text-gray-600">${summary}</td>
                        <td class="p-3 text-red-600 text-xs font-bold">⚠️ 發票或案場對應異常</td>
                        <td class="p-3">
                            <select id="fixProject_${i}" class="border rounded p-1 text-xs bg-white">
                                <option value="">-- 請選擇正確案場 --` + 
                                projectList.map(p => `<option value="${p.fullName}">${p.fullName}</option>`).join('') + `
                            </select>
                        </td>
                        <td class="p-3">
                            <button onclick="resolveException(${i})" class="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700">確認放行</button>
                        </td>
                    `;
                    exBody.appendChild(tr);
                } else {
                    let tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td class="p-3 font-medium">${row[0]}</td>
                        <td class="p-3">${row[1]}</td>
                        <td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-1 rounded">${row[2] || '正常'}</span></td>
                        <td class="p-3 text-gray-600">${summary}</td>
                        <td class="p-3 font-medium text-slate-700">${matchedProject || row[3] || '未分類'}</td>
                        <td class="p-3 font-semibold">NT$ ${Number(row[7] || row[6] || 0).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                }
            }

            document.getElementById("exceptionCount").innerText = exceptionRecords.length;
            if (exceptionRecords.length === 0) {
                exBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">目前沒有需要人工確認的單據，帳務非常乾淨！</td></tr>`;
            }
        }

        function resolveException(index) {
            let selectElem = document.getElementById(`fixProject_${index}`);
            let selectedVal = selectElem.value;
            if (!selectedVal) {
                alert("請先選擇正確的案場再放行！");
                return;
            }
            alert(`已成功將此筆單據指定案場為：${selectedVal} 並放行入帳！`);
            loadDataFromGAS(); 
        }

        function switchTab(tab) {
            let mainSec = document.getElementById("mainTableSection");
            let exSec = document.getElementById("exceptionTableSection");
            let navMain = document.getElementById("navMain");
            let navEx = document.getElementById("navException");
            let title = document.getElementById("pageTitle");

            if (tab === 'main') {
                mainSec.classList.remove("hidden");
                exSec.classList.add("hidden");
                navMain.className = "block py-2 px-3 rounded bg-slate-800 text-white font-medium";
                navEx.className = "block py-2 px-3 rounded hover:bg-slate-800";
                title.innerText = "單據即時清單與智慧解析";
            } else {
                mainSec.classList.add("hidden");
                exSec.classList.remove("hidden");
                navEx.className = "block py-2 px-3 rounded bg-slate-800 text-white font-medium";
                navMain.className = "block py-2 px-3 rounded hover:bg-slate-800";
                title.innerText = "人工確認專區（有疑慮單據隔離）";
            }
        }

        function parseAndTestSummary() {
            let text = document.getElementById("rawSummaryInput").value;
            let resultBox = document.getElementById("parseResult");
            resultBox.classList.remove("hidden");

            let dateMatch = text.match(/\d{1,2}\/\d{1,2}/);
            let invMatch = text.match(/[A-Z]{2}\d{8}/i);

            let matchedProject = "未知案別 (將被隔離至人工確認區)";
            for (let p of projectList) {
                if (text.includes(p.shortName) || text.includes(p.fullName)) {
                    matchedProject = p.fullName;
                    break;
                }
            }

            let statusColor = (invMatch && matchedProject !== "未知案別 (將被隔離至人工確認區)") ? "text-emerald-600 font-bold" : "text-amber-600 font-bold";

            resultBox.innerHTML = `
                <div><b>解析日期：</b> ${dateMatch ? dateMatch[0] : '⚠️ 未抓到日期'}</div>
                <div><b>解析發票：</b> ${invMatch ? invMatch[0].toUpperCase() : '⚠️ 格式異常或收據'}</div>
                <div class="${statusColor}"><b>對應案場：</b> ${matchedProject}</div>
            `;
        }

        window.onload = loadDataFromGAS;
    </script>
</body>
</html>
